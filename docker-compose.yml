version: '3.9'

services:

  # ── MySQL Database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: cpms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cpms_db
    ports:
      - "3307:3306"          # exposed on 3307 to avoid conflict with local MySQL
    volumes:
      - cpms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./cpms-backend
      dockerfile: Dockerfile
    container_name: cpms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cpms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CPMS_JWT_SECRET: cpms_super_secret_key_2024_make_it_very_long_and_secure_at_least_256_bits
      CPMS_JWT_EXPIRATION: 86400000
      CPMS_CORS_ALLOWED_ORIGINS: http://localhost,http://frontend
    ports:
      - "8080:8080"
    volumes:
      - cpms_uploads:/app/uploads

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./cpms-frontend
      dockerfile: Dockerfile
    container_name: cpms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  cpms_mysql_data:
  cpms_uploads:
