# Application
spring.application.name=cpms-backend
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/cpms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.password=${DB_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
cpms.upload.dir=uploads/

# JWT
jwt.secret=${JWT_SECRET}
cpms.jwt.expiration=86400000

# CORS
cpms.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:3000

# Security debug (temporary)
logging.level.org.springframework.security=DEBUG
